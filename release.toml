# Machine-readable release metadata.
# Updated by gogogo during the release procedure.
# Consumed by LLMs, CI systems, and tooling.

[release]
version = "0.2.0"
date = "2026-02-16"
commit = "a44ddb2"

# Human-written summary of what changed - the story, not the log.
# Written by Claude during gogogo, reviewed by the developer.
summary = """
First public release of TayPE. The multitrack engine is solid: transport with \
fade ramps, punch-in recording, clip editing, bus cascade routing, and a \
channel strip mixer with volume/pan/mute/solo. Channel preamp adds analogue \
warmth with soft-sine clipping and 4x oversampled saturation. VST3 plugin \
hosting runs in a sandboxed subprocess with 4-slot mixer inserts per channel. \
The MCP server exposes the full DAW state to Claude via the Tape Protocol. \
Two-branch release governance (unstable/main) with automated DMG packaging. \
258 functional tests cover the engine end-to-end.
"""

