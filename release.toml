# Machine-readable release metadata.
# Updated during checkpoints and releases.
# Consumed by LLMs, CI systems, and tooling.

[release]
version = "1.6.0"
date = "2026-11-14"
commit = "444ea741"

summary = """\
**Revamped keybindings system with a visual editor.** Search for actions and record shortcuts directly in TayPE. The Pro Tools-style *Industry Standard Bruh* profile has been updated, and you can save a printable PDF cheat sheet for your active profile.
**Use TayPE’s stock plug-ins in other DAWs.** The installer offers all seven stock effects as optional AU, VST3 and AAX plug-ins for hosts including Logic and Pro Tools.
**Run multiple VST instruments and MIDI FX on a single track.** Build layers in one insert rack, with separate trim, trim automation and MIDI sources for each instrument.
**Route MIDI to VST effects.** Send MIDI from a track to an effect, so you can play the bundled Sonicism Vintage Vocoder from a MIDI clip.
**Two-way AAF interchange.** Try finishing a session in TayPE without the worry of switching DAWs, rebuilding your edits or getting locked in. Bring your audio tracks and edits in from Pro Tools, Logic Pro, Cubase Pro or Nuendo. If you want to go back, export your TayPE timeline as an AAF with the audio embedded and pick up where you left off.
**Taype Comp adds a gate/expander and a selectable sidechain source.** Taype EQ and the channel EQ popup also get a dedicated Dynamics power button.
**Drag stem folders straight onto the timeline.** Export stems from an MPC project and drop the folder into TayPE. It creates a named track for each file and lines the clips up at the drop point.
**Drag a clip onto or below the Master track to create a new track.** TayPE moves the clip onto the new track in the same gesture.
**Sonicism Vintage Vocoder is now bundled with TayPE.** Use it on vocals, drums or other audio in your reel.
**Clip gain goes down to −144 dB.** The gain handle stays visible over the clip title, and stem splitting respects the gain you set.
**Zoom stock plug-in editors independently** of TayPE’s main interface.
**Recover takes cut short by a crash.** TayPE can recover interrupted recordings, and saves are more resilient to interrupted writes.
"""

