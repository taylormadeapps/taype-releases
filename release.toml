# Machine-readable release metadata.
# Updated during checkpoints and releases.
# Consumed by LLMs, CI systems, and tooling.

[release]
version = "1.6.1"
date = "2026-11-28"
commit = "22db0216"

summary = """\
**Default shortcuts changed. `⌘⌫` now deletes selected tracks.** `⌫` deletes selected clips, MIDI notes or automation points. Forward Delete (`Fn+⌫` on compact Mac keyboards) toggles clip disable or note mute. `⌘`+Forward Delete archives tracks.
**Clearer MIDI editing controls.** Piano-roll help shows your Delete, Mute and Split shortcuts, plus `L` for Legato. Piano keys light up while held. The arranger-grid link lights up when linked, and a kick drum marks grid-length note entry.
**More reliable audio recovery after sleep.** TayPE gives slow-reconnecting interfaces up to ten seconds to reappear and keeps existing audio interruption warnings visible until the interface returns.
**Better plug-in recall.** Reopening reels restores larger saved plug-in states, including full drum kits. Invalid states appear in Restore Issues. VST3 presets keep their saved status when the plug-in state matches.
**Clearer startup folder messages.** TayPE tells you which folder it falls back to when your chosen user folder is unavailable, and warns you if neither folder can be used.
"""

