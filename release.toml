# Machine-readable release metadata.
# Updated during checkpoints and releases.
# Consumed by LLMs, CI systems, and tooling.

[release]
version = "1.5.0"
date = "2026-10-10"
commit = "68e1db8e"

summary = """\
Added Seldon’s Law offline stem printing, with corrected stems, preserved original wet stems and a reconstruction report.
Reworked Print Mix and offline automation, with clearer reports, safer cancellation and protection for files already written.
Improved JD’s Law wet-stem isolation and alignment between stems and the master.
Archived tracks no longer consume processing resources or affect playback, routing or prints. Track outputs can also be set to Off.
Improved plug-in channels, sidechains, device reconfiguration and recovery from stalled or failed plug-ins.
Slow plug-in scans can be left running or skipped; skipped plug-ins can still be loaded.
Fixed keyboard shortcuts and focus in plug-in and ARA editors, and improved plug-in window handling.
Improved grouped routing, device changes, sleep/wake handling and reel-save efficiency.
Fixed a Help-menu memory leak and an ARA shutdown crash.
"""

