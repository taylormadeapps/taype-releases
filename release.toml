# Machine-readable release metadata.
# Updated during checkpoints and releases.
# Consumed by LLMs, CI systems, and tooling.

[release]
version = "1.3.0"
date = "2026-09-02"
commit = "2b526388"

summary = """\
TayPE 1.3.0 draws a line under the previous generation. The app has been rewritten on a fresh code base, bringing stronger performance and stability and a new foundation for what comes next.
Added full automation for the mixer, channel strip and every parameter exposed by hosted plug-ins, including VSTi instruments. Record touched controls or draw and edit automation directly on the timeline, keep multiple lanes open, disable lanes without deleting their points, edit grouped tracks together, and move or duplicate clips with their automation.
Added VSTi Live MIDI Playback mode. Open a VSTi window to hear its MIDI clips playing through the live instrument for immediate editing and auditioning; close it and the track returns to its committed audio. MIDI rerenders now include plug-in automation and retain the previous committed audio if a replacement fails.
Reworked playback, transport and delay compensation. Starts land at the requested position, instruments and effects ring out naturally on stop, loop transitions remain click-free, and clips, instruments, buses, the master, automation, loop repeats and plug-in playheads stay aligned through large-latency processors, hardware inserts and varispeed.
Reworked recording and comping. Count-in, punch, Comp and Dub takes remain aligned through instrument latency and lookahead; incomplete loop takes follow the global discard preference; ordinary takes commit without rebuilding the playback graph; and comp-bus hierarchy, take editing and monitoring behave consistently.
Print Mix and offline rendering now follow the actual timeline and transport state. Clocked instruments receive the correct timing, while advanced instruments, automation, hardware inserts and processing latency remain aligned through the print.
Expanded MIDI and timeline editing with original-MIDI restore, batch rerendering, linked editor views, correct held-note seeking and loop-boundary releases, improved marker and loop-brace navigation, snapped pointer splits, cursor-targeted fades and an unbounded timeline.
Improved mixer and plug-in workflows with track reordering from headers or mixer strips, better scrolling and focus behaviour, reliable asynchronous plug-in editors, safer sandbox recovery, live delay updates, dry-audio protection during overload and clearer session diagnostics.
Refined the stock effects with compressor auto-gain, Taype Rooms IR navigation and **NOT SUBTLE**, plus Ache-Delay tape bypass and its own **NOT SUBTLE** full-drive mode. Downloaded TONE3000 packages can also be opened directly in the local library.
Plus many more features, stability and performance improvements throughout TayPE.
"""

