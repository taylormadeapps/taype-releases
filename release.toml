[release]
version = "1.0.4"
date = "2026-07-06"
commit = "c7cf007b"

summary = """\
Improves waveform rendering and audio import peak handling so clips draw at the correct scale and imported audio shows reliable peak detail.
Adds the MIDI monitor window, arranger follow-playhead toggle, and expanded Mackie MCU / X-Touch One control-surface behaviour.
Improves insert workflows with a custom plugin picker, more reliable sparse insert slots, sidechain bus activation, and chained sidechain routing.
Improves TONE3000 and NAM handling, including user-root NAM profile paths, metadata/auth fixes, typed send schemas, and preserving NAM Drive/Output when switching models.
Fixes mixer selected-track focus, EQ RTA graph floor clipping, MIDI graph-rebuild safety, feedback-dialog focus, and TAPE_HOME content path handling.
Fixes contained clip drops so replacing material inside an existing clip does not create an unwanted auto-crossfade.
"""

