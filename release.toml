# Machine-readable release metadata.
# Updated during checkpoints and releases.
# Consumed by LLMs, CI systems, and tooling.

[release]
version = "1.4.0"
date = "2026-09-21"
commit = "02db461c"

summary = """\
External MIDI Out records and renders the instrument’s live audio into the same clip.
Channel compressor: sidechain routing, detector tilt, and history display.
MIDI is stored and rendered at high resolution.
Improved plug-in crash handling: the culprit is identified, visually marked, and isolated.
Disabled plug-ins unload by default, to reduce memory pressure eating into DSP.
Improved automation: count-in capture, clearer lane waveforms, and Automation View no longer pinning the arranger fader.
Multiple tempos and time signatures on the main timeline via Cuts.
175% and 200% UI scale.
MIDI notes can be resized from the left edge; MIDI clips can be grown from the arranger trim.
"""

