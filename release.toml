version = "0.22.0"
date = "2026-06-10"
commit = "d6629cae"

summary = """\
Added ONNX stem splitting with model onboarding, dependency reporting, and reel-aware stem split persistence.
Added stereo pan modes, frequency-dependent width splitting, and aux send preprocessing controls for more flexible mix shaping.
Added portable I/O route references so reels preserve hardware/plugin routing more reliably across sessions and devices.
Added clip reverse rendering and clearer clip media path display in Clip Properties.
Added bulk track workflows, improved import progress feedback, and fixed import progress repainting.
Added channel strip, section, and hardware insert preset workflows.
Improved timeline and mixer refresh cadence, reduced runtime telemetry overhead, and fixed channel strip hit testing.
Refreshed launch/licensing presentation and fixed the Claude connector menu command.
"""

