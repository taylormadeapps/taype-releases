[release]
version = "1.5.1"
date = "2026-10-13"
commit = "bbb2cf09"

summary = """\
Split and Tab now work at the playhead on whatever is selected. Tab stops at clip edges and passes over held notes, and Escape clears the clip selection before the track selection.
Recording can start just after 0:00 with a count-in, and the timeline no longer follows the playhead while stopped.
Fixed an update check that reported a failure when no beta was available.
"""

