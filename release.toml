[release]
version = "1.4.1"
date = "2026-09-24"
commit = "8a98033c"

summary = """\
Improved offline bouncing, including optional 4× plug-in oversampling and reliable VST3 mode restoration.
Prevents inactive instrument automation from blocking an unrelated offline bounce, with much clearer render-failure diagnostics.
Added a persistent global option for print tails.
Fixed instrument-output recording and several mixer layout issues.
Reels can now save safely when media is missing; autosave and quit persistence are more reliable.
Performance diagnostics reset cleanly for each playback.
"""

