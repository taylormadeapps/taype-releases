# Machine-readable release metadata.
# Updated during checkpoints and releases.
# Consumed by LLMs, CI systems, and tooling.

[release]
version = "1.2.1"
date = "2026-07-22"
commit = "d030c332"

summary = """\
Record Mode is now independent of Loop, with clearer Auto Punch, Comp, Dub and Sooper-Looper workflows plus dedicated Record Stop Mode controls.
Plug-in editors now open, focus, hide and restore reliably across multiple windows, sandbox restarts and Print Mix; Option+P works app-wide without losing editor state.
Insert rows retain named preset provenance and mark live edits with `*`, while the reserved Default preset continues showing the plug-in name.
Timeline editing is more predictable: narrow clips remain draggable, Shift-resize magnetically butts clips without forced crossfades, playhead snap follows the visible grid, and stopped edits no longer jump the viewport.
Cmd+Option+wheel now zooms both axes in the arranger and MIDI editor; MIDI quantise settings can be stepped in either direction, and Cmd+Q now requests confirmation.
Metronome clicks now follow the time-signature denominator, so 8/8 receives quaver clicks.
Ranged markers can be dragged by their body without moving loop braces; Shift+/ creates a No Cut range, and range menus clearly identify source Cuts.
"""

