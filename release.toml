# Human-written summary of what changed - the story, not the log.
# Written by Claude during gogogo, reviewed by the developer.
summary = """\
Release infrastructure hardening. DMG installers are now signed with a \
Developer ID Application certificate so macOS Gatekeeper no longer blocks \
the app on first launch. The packaging script auto-detects the signing \
identity, deep-signs all nested binaries with hardened runtime, and has \
notarization support ready for when credentials are configured. Release \
assets now land in a structured dist/mac/<arch>/ directory tree, and the \
gogogo procedure publishes to the taype-releases repo with tags and \
GitHub releases.
"""

