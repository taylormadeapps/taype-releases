# Machine-readable release metadata.
# Updated during checkpoints and releases.
# Consumed by LLMs, CI systems, and tooling.

[release]
version = "1.1.0"
date = "2026-07-11"
commit = "dea1a085"

summary = """\
Expanded loop recording and comping with promoted lap history, clearer take ghosts, safer trimming/resizing, and automatic activation of the final complete take.
Added clip slip editing, blank clips, groove templates, independently resizable cut-marker ranges, and more reliable split-fade and cut cleanup.
Hardened Print Mix and stem capture, including cut-marker print regions and improved timing/capture accuracy.
Added MotorMix HUI support and control-surface grouping, with corrected X-Touch One master mapping and numbering.
Updated NAM A2 processing to v0.5.4 with shared-weight multichannel batching, architecture-aware turbo processing, and improved stability.
Added global Efficient, Balanced and Quality settings for preamps and summing, plus optional Quality processing for offline prints.
Improved plug-in workflows with search multi-select, insert-rack disable overrides, bulk insert deletion, Listen Bus insert fixes, and more reliable plug-in/NAM recall.
Added dynamic EQ threshold tilt, tighter snap boundaries, metronome volume control, and improved live-input and NAM AMX mutation safety.
Added an optional dual time/bars transport display.
Added mouse-position zoom, magnetic Shift-drag clip placement without forced crossfades, and knob-wheel scrolling preferences covering mixer and arranger channel strips.
Improved CoreAudio diagnostics, localisation coverage, and several interaction and routing edge cases.
"""

