# Machine-readable release metadata.
# Updated during checkpoints and releases.
# Consumed by LLMs, CI systems, and tooling.

[release]
version = "1.3.2"
date = "2026-09-08"
commit = "00943e47"

summary = """\
Added per-Cut speed commits with atomic clip stretching, plus global varispeed controls and tempo-aware speed editing.
Offline renders now honour automation.
Improved plug-in stability with guided sandbox recovery and safer VST3 shutdown.
Made stock plug-in reel identifiers portable across installations.
Fixed Dub recording so existing material continues playing while a new layer is recorded.
Preserved count-in clicks, restored loop-end playback, and enabled MIDI recording on External MIDI Out tracks.
Added the IO Station Mothership master-strip controller profile.
Expanded the compressor with signal history, visibility controls, oversampled soft clipping, VST wet/dry control, clearer comparison views, and input/pre/post peak markers.
Fixed pitch-processing dialogs so they refresh when rendering completes.
"""

