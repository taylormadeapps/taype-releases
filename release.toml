# Machine-readable release metadata.
# Updated during checkpoints and releases.
# Consumed by LLMs, CI systems, and tooling.

[release]
version = "1.2.0"
date = "2026-07-19"
commit = "44fedfa8"

summary = """\
Expanded MIDI editing with one-click note creation, duplication, Legato, controller editing and filtering, playback editing, improved snapping and collision handling, piano-roll navigation, and bundled hardware groove quantise.
Made MIDI and VSTi recording more reliable across punch-in, looping, virtual keyboards, sandboxed instruments, Sooper-Looper, and editor-preview note release.
Added layered Loop Record Dub and strengthened comping: existing material becomes the first comp layer, dub layers survive edits, child tracks insert, name, and mute correctly, offline flattening respects every cut, and empty buses no longer show ghost cues.
Added multi-output instrument routing, clip channel conversion, and offline bounce workflows.
Improved Melodyne and ARA2 loading, editor context, committing, provider lifetime, and plug-in lifecycle behaviour.
Expanded Taype Drive with channel modes, M/S band-split mixing, resizable controls, and stronger plug-in-window reliability; improved plug-in searching and Listen Bus recall.
Added JD’s Law wet-stem printing, grid splitting, clip pitch nudging, Rooms IR navigation, and waveform-correct slip editing.
Improved recording finalisation and timing, clean shutdown, crash reporting, and general editor and transport reliability.
"""

