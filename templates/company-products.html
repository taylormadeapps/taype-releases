    <section id="products" class="page-section products" aria-labelledby="products-heading">
        <h2 id="products-heading">{{products.heading}}</h2>
        <div class="product-grid">
            <a class="product-card product-feature" href="/harmonculus/" aria-labelledby="product-harmonculus">
                <div class="product-details">
                    <h3 id="product-harmonculus" class="product-title">{{products.harmonculus.title}} <span class="product-arrow" aria-hidden="true">→</span></h3>
                    <p class="product-tagline">{{products.harmonculus.tagline}}</p>
                    <p>{{products.harmonculus.summary}}</p>
                </div>
                <div class="product-media">
                    <img src="/harmonculus/images/spectral-editor.webp" width="1440" height="1095" alt="{{products.harmonculus.image_alt}}" loading="lazy" decoding="async">
                </div>
            </a>
            <a class="product-card" href="https://taype.ruminantaudioworks.com/product/" aria-labelledby="product-taype">
                <div class="product-media">
                    <img src="/assets/img/screenshot-tape-machine-960.webp" width="960" height="591" alt="{{products.taype.image_alt}}" loading="lazy" decoding="async">
                </div>
                <div class="product-details">
                    <h3 id="product-taype" class="product-title">{{products.taype.title}} <span class="product-arrow" aria-hidden="true">→</span></h3>
                    <p>{{products.taype.summary}}</p>
                </div>
            </a>
            <a class="product-card" href="/vintage-vocoder/" aria-labelledby="product-vocoder">
                <div class="product-media">
                    <img src="/assets/img/about/vintage-vocoder.webp" width="1140" height="762" alt="{{products.vocoder.image_alt}}" loading="lazy" decoding="async">
                </div>
                <div class="product-details">
                    <h3 id="product-vocoder" class="product-title">{{products.vocoder.title}} <span class="product-arrow" aria-hidden="true">→</span></h3>
                    <p>{{products.vocoder.summary}}</p>
                </div>
            </a>
            <a class="product-card" href="https://mpc.ruminantaudioworks.com/" aria-labelledby="product-mpc">
                <div class="product-media">
                    <img src="/assets/img/about/mpc-plugin-loader.webp" width="1140" height="544" alt="{{products.mpc.image_alt}}" loading="lazy" decoding="async">
                </div>
                <div class="product-details">
                    <h3 id="product-mpc" class="product-title">{{products.mpc.title}} <span class="product-arrow" aria-hidden="true">→</span></h3>
                    <p>{{products.mpc.summary}}</p>
                </div>
            </a>
        </div>
    </section>
