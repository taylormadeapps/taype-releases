    <section id="community" class="page-section raw-community" aria-labelledby="community-heading">
        <h2 id="community-heading">{{heading}}</h2>
        <div class="raw-community-grid">
            <div class="raw-community-card">
                <h3>{{follow.title}}</h3>
                <p>{{follow.body}}</p>
                <div class="raw-community-links">
                    <a href="/newsletter-subscribe/" target="_blank" rel="noopener">{{follow.newsletter}} <span aria-hidden="true">→</span></a>
                    <a href="https://instagram.com/ruminantaudioworks" target="_blank" rel="noopener">{{follow.instagram}} <span aria-hidden="true">→</span></a>
                    <a href="https://www.youtube.com/@ruminantaudioworks" target="_blank" rel="noopener">{{follow.youtube}} <span aria-hidden="true">→</span></a>
                    <a href="https://www.reddit.com/r/taype/" target="_blank" rel="noopener">{{follow.reddit}} <span aria-hidden="true">→</span></a>
                </div>
            </div>
            <div class="raw-community-card">
                <h3>{{contact.title}}</h3>
                <p>{{contact.body}}</p>
                <div class="raw-community-links">
                    <a href="https://docs.google.com/forms/d/e/1FAIpQLSeNeffSYAHaNKixSyw9ndouZAl80o2B_-yqo_LiuNYr-2e6Ow/viewform?usp=pp_url&amp;entry.175803976=N/A" target="_blank" rel="noopener">{{contact.link}} <span aria-hidden="true">→</span></a>
                </div>
            </div>
        </div>
    </section>
