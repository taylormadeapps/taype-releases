<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsletter sign-up… - TayPE</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/img/logo-square.png">
<link rel="canonical" href="https://taype.ruminantaudioworks.com/newsletter-subscribe/">

<!-- Instant redirect to the newsletter sign-up form. JS handles it first
     (replace() keeps it out of history); meta refresh is the no-JS fallback;
     the visible link is the belt-and-braces fallback if both fail. -->
<meta http-equiv="refresh" content="0; url=https://docs.google.com/forms/d/e/1FAIpQLSeIHpJy7bcYi09VlkZ_sK7amYLtec3mPtDL2r2Qc9NUf0RqYw/viewform">

<style>
:root {
    --bg:          #0e0d0b;
    --panel:       #1b1813;
    --text:        #f5f1e8;
    --text-muted:  #e2d8c7;
    --brass:       #f0c96a;
    --brass-hover: #e0a84e;
    --border:      #2a2520;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { background: var(--bg); color: var(--text); }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
}

.card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 48px 40px;
    max-width: 480px;
    width: 100%;
    text-align: center;
}

.card p {
    color: var(--text-muted);
    margin: 0;
}

.card a {
    color: var(--brass);
    text-decoration: none;
    transition: color 0.2s;
}
.card a:hover { color: var(--brass-hover); }

.spinner {
    display: inline-block;
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--brass);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 24px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="card">
    <div class="spinner"></div>
    <p>Taking you to the newsletter sign-up…<br>
       If nothing happens,
       <a href="https://docs.google.com/forms/d/e/1FAIpQLSeIHpJy7bcYi09VlkZ_sK7amYLtec3mPtDL2r2Qc9NUf0RqYw/viewform">tap here</a>.</p>
</div>

<script>
    window.location.replace('https://docs.google.com/forms/d/e/1FAIpQLSeIHpJy7bcYi09VlkZ_sK7amYLtec3mPtDL2r2Qc9NUf0RqYw/viewform');
</script>

</body>
</html>
